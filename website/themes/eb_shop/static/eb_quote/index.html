<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能询价 | Green Rich 金瑞治 - 复印机感光鼓芯</title>
<meta name="description" content="Green Rich金瑞治AI智能询价系统，对话式咨询复印机感光鼓芯，实时报价，一键生成报价单。">
<meta name="keywords" content="AI询价,智能报价,复印机鼓芯,Green Rich,金瑞治">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== Header ===== -->
<header>
  <div class="container nav">
    <a class="logo" href="index.html">
      <span class="dot">G</span>Green Rich <small>金瑞治</small>
    </a>
    <nav class="nav-links">
      <a href="/" >首页</a>
      <a cid="105" href="/c105p1.html">产品中心</a>
      <a cid="106" href="/c106p1.html">行业资讯</a>
      <a cid="108" href="/c108p1.html">关于我们</a>
      <a cid="109" href="/c109p1.html">加盟合作</a>
      <a class="active">智能报价</a>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="btn-quote">
        🛒 询价篮
        <span class="cart-badge hidden" id="headerCartBadge">0</span>
      </a>
      <button class="mobile-toggle" onclick="document.querySelector('.nav-links').style.display=document.querySelector('.nav-links').style.display==='flex'?'none':'flex'">☰</button>
    </div>
  </div>
</header>

<!-- ===================================================================
     ===== 智能询价主区域 =====
     =================================================================== -->
<div class="ai-wrapper">

  <!-- ========== 左：聊天区 ========== -->
  <div class="chat-panel">

    <div class="chat-header">
      <div class="chat-header-left">
        <div class="ai-avatar">🤖</div>
        <div class="chat-header-info">
          <h2>Green Rich 智能询价助手 <span class="ai-badge">AI</span></h2>
          <p>在线 · 随时为您报价</p>
        </div>
      </div>
      <div class="chat-header-right">
        <!-- 移动端询价单按钮 -->
        <button class="mobile-quote-btn" type="button" onclick="openQuote()">
          🛒 询价单
          <span class="mq-badge hidden" id="mobileQuoteBadge">0</span>
        </button>
      </div>
    </div>

    <div class="chat-body" id="chatBody"></div>

    <div class="chat-input-area">
      <div class="chat-input-box">
        <textarea id="chatInput" rows="1" placeholder="输入品牌、型号或设备机型，例如：佳能 IR1730…" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>

  </div>

  <!-- ========== 右：实时询价单（桌面端） ========== -->
  <div class="quote-panel">

    <div class="quote-header">
      <h3><span class="dot"></span>实时询价单</h3>
      <div class="sub-info">已享 <strong style="color:#15803d;">10% 优惠折扣</strong></div>
    </div>

    <div class="quote-body" id="quoteBodyDesktop"></div>

    <div class="quote-footer" id="quoteFooterDesktop" style="display:none;">
      <div class="qf-row"><span>商品款数</span><b><span id="qfCountDesktop">0</span> 款</b></div>
      <div class="qf-row"><span>总数量</span><b><span id="qfQtyDesktop">0</span> 支</b></div>
      <div class="qf-row"><span>原价合计</span><b>¥<span id="qfOriginalDesktop">0.00</span></b></div>
      <div class="qf-row discount"><span>优惠折扣</span><b id="qfDiscountDesktop">-¥0.00</b></div>
      <div class="qf-row total"><span>报价合计</span><b>¥<span id="qfTotalDesktop">0.00</span></b></div>
      <div class="qf-actions">
        <button class="btn btn-accent" onclick="submitToCart()">🛒 提交到购物车</button>
        <button class="btn btn-outline" onclick="generateQuoteLink()">🔗 生成报价链接</button>
      </div>
    </div>

  </div>

</div>

<!-- ===================================================================
     ===== 原生 Offcanvas：移动端实时询价单 =====
     =================================================================== -->
<div class="offcanvas-backdrop" id="offcanvasBackdrop" onclick="closeQuote()"></div>

<div class="offcanvas" id="quoteOffcanvas" role="dialog" aria-modal="true" aria-labelledby="offcanvasTitle">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="offcanvasTitle">
      <span class="dot"></span>实时询价单
    </h5>
    <button type="button" class="offcanvas-close" onclick="closeQuote()" aria-label="关闭">✕</button>
  </div>
  <div class="offcanvas-body">
    <div class="sub-info" style="padding:12px 20px 0;font-size:12px;color:var(--muted);">
      已享 <strong style="color:#15803d;">10% 优惠折扣</strong>
    </div>
    <div class="quote-body" id="quoteBodyMobile"></div>
    <div class="quote-footer" id="quoteFooterMobile" style="display:none;">
      <div class="qf-row"><span>商品款数</span><b><span id="qfCountMobile">0</span> 款</b></div>
      <div class="qf-row"><span>总数量</span><b><span id="qfQtyMobile">0</span> 支</b></div>
      <div class="qf-row"><span>原价合计</span><b>¥<span id="qfOriginalMobile">0.00</span></b></div>
      <div class="qf-row discount"><span>优惠折扣</span><b id="qfDiscountMobile">-¥0.00</b></div>
      <div class="qf-row total"><span>报价合计</span><b>¥<span id="qfTotalMobile">0.00</span></b></div>
      <div class="qf-actions">
        <button class="btn btn-accent" >🛒 提交到购物车</button>
        <button class="btn btn-outline" >🔗 联系人工客服</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">✅ 操作成功</div>

<!-- 报价链接弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-icon">✅</div>
    <h3>报价链接已生成</h3>
    <p>点击下方链接，即可打开您的专属询价篮页面，查看本次咨询的所有产品与报价。</p>
    <div class="modal-link">
      <input type="text" id="quoteLink" readonly value="">
      <button onclick="copyLink()">复制</button>
    </div>
    <div class="modal-actions">
      <a href="cart.html" class="btn btn-accent">🛒 打开询价篮</a>
      <button class="btn btn-outline" onclick="closeModal()">继续咨询</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>

</body>
</html>
