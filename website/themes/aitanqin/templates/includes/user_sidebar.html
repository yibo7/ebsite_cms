<!-- ===== 侧边栏（用户信息卡片 + 导航菜单） ===== -->
<div class="col-lg-3">
  <!-- 用户信息卡片 -->
  <div class="ucard-profile mb-3">
    <a href="/u{{ user.id }}.html" class="ucard-avatar-wrap text-decoration-none">
      <div class="ucard-avatar">
        <span>{{ (user.ni_name or user.name)[0] }}</span>
      </div>
    </a>
    <h5 class="ucard-name">{{ user.ni_name or user.name }}</h5>
    <p class="ucard-meta">@{{ user.name }}</p>
    <div class="ucard-stats-row">
      <div class="ucard-stat">
        <span class="ucard-stat-num">{{ stats.total }}</span>
        <span class="ucard-stat-label">曲谱</span>
      </div>
      <div class="ucard-stat">
        <span class="ucard-stat-num">{{ stats.total_hits }}</span>
        <span class="ucard-stat-label">人气</span>
      </div>
      <div class="ucard-stat">
        <span class="ucard-stat-num">{{ sub_count }}</span>
        <span class="ucard-stat-label">订阅</span>
      </div>
    </div>
  </div>

  <!-- 导航菜单 -->
  <div class="ucard-nav">
    <a href="/user/index" class="ucard-nav-item{{ ' active' if active_nav == 'index' else '' }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      控制面板
    </a>
    <a href="/user/favorite" class="ucard-nav-item{{ ' active' if active_nav == 'favorite' else '' }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      我的收藏
    </a>
    <a href="/user/subscriptions" class="ucard-nav-item{{ ' active' if active_nav == 'subscriptions' else '' }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      我的订阅
    </a>
    <a href="/atq/post_data" class="ucard-nav-item{{ ' active' if active_nav == 'subscriptions' else '' }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      去发布
    </a>
    <a href="/log_out" class="ucard-nav-item ucard-nav-exit">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      退出登录
    </a>
  </div>
</div>
