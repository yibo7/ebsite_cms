{% extends 'base_admin.html' %}
{% block content %}

<div class="eb-box">
    <div class="btn-toolbar px-2">
        <form class="d-flex flex-wrap align-items-center gap-2">
            <div class="btn-group">
                <input class="form-control" placeholder="关键字" name="k" type="text" required/>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" type="submit">
                    <i class="fa fa-search"></i> 搜索
                </button>
            </div>
            <div class="btn-group">
                <a href="admin_list_save" class="btn btn-outline-primary">
                    <i class="fa fa-plus"></i> 添加管理员
                </a>
            </div>
            <div class="btn-group">
                <a class="btn btn-outline-danger" onclick="return confirm('将删除包括其下的子菜单，确认要删除所选项吗？');" href="javascript: del_items('admin_list_del')">
                    <i class="fa fa-trash"></i> 删除
                </a>
            </div>
        </form>

    </div>
    {{table_html}}
</div>

{% endblock %}
