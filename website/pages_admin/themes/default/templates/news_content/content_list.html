{% extends 'base_admin.html' %}
{% block content %}

<div class="table-box">
    <div class="btn-toolbar px-2">
        <form method="get" class="d-flex flex-wrap align-items-center gap-2">
            <div class="btn-group">
                <input class="form-control" placeholder="关键字" name="k" type="text" value="{{ keyword }}" />
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" type="submit">
                    <i class="fa fa-search"></i> 搜 索
                </button>
            </div>
            <div class="btn-group">
                <select onchange="OnClassChange(this)" name="cid" style="max-width:300px" class="form-control">
                    <option value="">所有分类</option>
                    {{build_sel_item(class_list,'_id','class_name',class_id)}}
                </select>
            </div>
            <div class="btn-group">
                <button onclick="OpenSelToSpecial()" class="btn btn-outline-primary" type="button">
                    <i class="fa fa-folder-open"></i> 添加到专题
                </button>
            </div>
            <div class="btn-group">
                <a class="btn btn-outline-danger" onclick="return confirm('确认要删除所选项吗？');" href="javascript: del_items('content_list_del')">
                    <i class="fa fa-trash"></i> 删 除
                </a>
            </div>
        </form>
    </div>
    {{table_html}}
</div>
<nav class="mt-2 px-2 mb-3">
    {{pager}}
</nav>

<script>
    function OnClassChange(ob) {
        var vl = get_selected_value(ob);
        location.href = "?cid="+vl;
    }
    function OpenSelToSpecial() {
        var ids = get_checkboxval(".eb-table");
        if (ids)
            OpenIframe('special_sel_box?ids='+ids,'选择专题','保存到专题',300,350)
        else
            alert("请选择要删除的数据！");
    }
</script>

{% endblock %}
