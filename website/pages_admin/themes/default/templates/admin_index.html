{% extends 'base_admin.html' %}
{% block content %}

<style>
.admin-layout {
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ===== 顶部导航栏 - 蓝色调背景 ===== */
.admin-topbar {
    height: 52px;
    background: #1d4ed8;
    box-shadow: 0 2px 8px rgba(29,78,216,0.25);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px 0 0;
    flex-shrink: 0;
    position: relative;
    z-index: 1000;
}

.admin-topbar-left {
    display: flex;
    align-items: center;
    height: 100%;
}

/* LOGO 文字风格，不依赖图片 */
.admin-logo-link {
    display: flex;
    align-items: center;
    padding: 0 18px;
    height: 100%;
    text-decoration: none !important;
    gap: 6px;
}

.admin-logo-link:hover {
    background: rgba(255,255,255,0.06);
}

.admin-logo-icon {
    width: 30px;
    height: 30px;
    background: #fbbf24;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1d4ed8;
    font-size: 16px;
    font-weight: 800;
    flex-shrink: 0;
    line-height: 1;
}

.admin-logo-text {
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
}

/* 顶部菜单 - 按钮/标签风格 */
.admin-nav {
    display: flex;
    align-items: center;
    height: 100%;
    margin-left: 8px;
    gap: 4px;
}

.admin-nav-item {
    padding: 6px 18px;
    height: auto;
    display: flex;
    align-items: center;
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.25s ease;
    gap: 7px;
    white-space: nowrap;
    user-select: none;
    border-radius: 8px;
    font-weight: 500;
    border: 1px solid transparent;
}

.admin-nav-item i {
    font-size: 15px;
}

.admin-nav-item:hover {
    color: #fff;
    background: rgba(255,255,255,0.12);
}

.admin-nav-item.active {
    color: #1d4ed8;
    background: #fff;
    border-color: rgba(255,255,255,0.3);
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

/* 用户下拉 */
.admin-user {
    position: relative;
}

.admin-user-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    color: #fff;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.25s ease;
}

.admin-user-btn:hover {
    background: rgba(255,255,255,0.25);
    border-color: rgba(255,255,255,0.5);
}

.admin-user .dropdown-menu {
    border: none;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    padding: 6px;
    min-width: 180px;
    margin-top: 10px !important;
}

.admin-user .dropdown-item {
    border-radius: 6px;
    padding: 9px 14px;
    font-size: 13px;
    transition: all 0.2s;
}

.admin-user .dropdown-item:hover {
    background: #eef2ff;
    color: #3b82f6;
}

.admin-user .dropdown-item i {
    margin-right: 8px;
    width: 18px;
    text-align: center;
}

/* ===== 主体区域 ===== */
.admin-body {
    flex: 1;
    display: flex;
    overflow: hidden;
}

/* 左侧菜单栏 */
.admin-sidebar {
    width: 190px;
    background: #fff;
    border-right: 1px solid #e5e7eb;
    overflow-y: auto;
    flex-shrink: 0;
    transition: width 0.25s ease, min-width 0.25s ease;
    min-width: 190px;
}

.admin-sidebar.collapsed {
    width: 0;
    min-width: 0;
    overflow: hidden;
    border-right: none;
}

/* 侧栏菜单组 */
.sidebar-group {
    border-bottom: 1px solid #f3f4f6;
}

.sidebar-group-title {
    padding: 0 14px;
    height: 42px;
    line-height: 42px;
    font-size: 14px;
    font-weight: 500;
    color: #374151;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f9fafb;
    transition: all 0.2s;
    border-bottom: 1px solid #f3f4f6;
    user-select: none;
}

.sidebar-group-title:hover {
    background: #eef2ff;
    color: #3b82f6;
}

.sidebar-group-title i:first-child {
    font-size: 14px;
    color: #3b82f6;
    width: 16px;
    text-align: center;
}

.sidebar-group-title .arrow {
    margin-left: auto;
    font-size: 10px;
    color: #9ca3af;
    transition: transform 0.2s;
}

.sidebar-group-title .arrow.open {
    transform: rotate(90deg);
}

.sidebar-items {
    list-style: none;
    padding: 0;
    margin: 0;
}

.sidebar-item {
    border-bottom: 1px solid #f9fafb;
}

.sidebar-item a {
    display: block;
    padding: 9px 14px 9px 30px;
    font-size: 13px;
    color: #4b5563;
    transition: all 0.2s;
    text-decoration: none;
}

.sidebar-item a:hover {
    color: #3b82f6;
    padding-left: 34px;
    background: #f5f7ff;
}

.sidebar-item.active {
    background: #eef2ff;
    position: relative;
}

.sidebar-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: #3b82f6;
}

.sidebar-item.active a {
    color: #3b82f6;
    font-weight: 600;
}

/* 伸缩条 */
.admin-resizer {
    width: 8px;
    background: #f3f4f6;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.admin-resizer::before {
    content: '';
    display: block;
    width: 2px;
    height: 32px;
    background: #d1d5db;
    border-radius: 1px;
    transition: background 0.2s;
}

.admin-resizer:hover {
    background: #dbeafe;
}

.admin-resizer:hover::before {
    background: #3b82f6;
}

/* 右侧内容区 */
.admin-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #f1f5f9;
}

.admin-content-header {
    height: 42px;
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    padding: 0 20px;
    flex-shrink: 0;
    gap: 8px;
}

.admin-content-header i {
    color: #f97316;
    font-size: 15px;
}

.admin-content-header span {
    font-size: 14px;
    font-weight: 500;
    color: #374151;
}

.admin-content-frame {
    flex: 1;
    overflow: hidden;
}

.admin-content-frame iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #f1f5f9;
}

/* 加载动画 */
.admin-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 0;
    color: #9ca3af;
    font-size: 14px;
}

.admin-loading img {
    width: 28px;
    height: 28px;
    margin-right: 8px;
}

/* 滚动条美化 */
.admin-sidebar::-webkit-scrollbar {
    width: 4px;
}

.admin-sidebar::-webkit-scrollbar-thumb {
    background: #d1d5db;
    border-radius: 2px;
}
</style>

<div class="admin-layout">
    <!-- 顶部导航栏 -->
    <div class="admin-topbar">
        <div class="admin-topbar-left">
            <a target="rform" href="wellcome" class="admin-logo-link">
                <div class="admin-logo-icon">E</div>
                <span class="admin-logo-text">EBSITE</span>
            </a>
            <div class="admin-nav" id="panrent-menu">
                {% for menu in menu_data %}
                    <div class="admin-nav-item" data-mid="{{menu._id}}">
                        <i class="{{menu.image_url}}"></i> {{menu.menu_name}}
                    </div>
                {% endfor %}
            </div>
        </div>
        <div class="admin-user dropdown px-2">
            <button class="admin-user-btn" data-bs-toggle="dropdown" aria-expanded="false" title="用户菜单">
                <i class="fa fa-user"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a target="rform" href="wellcome" class="dropdown-item"><i class="fa fa-home"></i> 管理首页</a></li>
                <li><a target="rform" href="admin_change_pass" class="dropdown-item"><i class="fa fa-key"></i> 修改密码</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a href="log_out" onclick="return confirm('确定要退出登录？');" class="dropdown-item text-danger"><i class="fa fa-sign-out"></i> 退出 ({{g.u.ni_name}})</a></li>
            </ul>
        </div>
    </div>

    <!-- 主体区域 -->
    <div class="admin-body">
        <!-- 左侧菜单 -->
        <div id="leftList" class="admin-sidebar">
            <div id="LeftMenuList">
                <div class="admin-loading">
                    <img src="{{ admin_path }}images/loading.gif" alt="加载中" />
                    加载菜单...
                </div>
            </div>
        </div>

        <!-- 伸缩条 -->
        <div class="admin-resizer" id="resizerBar" title="切换左侧菜单"></div>

        <!-- 右侧内容 -->
        <div class="admin-content">
            <div class="admin-content-header">
                <i class="fa fa-arrow-circle-right"></i>
                <span id="pageTitle">管理首页</span>
            </div>
            <div class="admin-content-frame">
                <iframe name="rform" id="rform" src="wellcome" scrolling="yes"></iframe>
            </div>
        </div>
    </div>
</div>

<script>
/* ===== 顶部导航菜单切换 ===== */
$(function(){
    /* 为所有顶部菜单项绑定点击事件 */
    $("#panrent-menu").on("click", ".admin-nav-item", function() {
        var $this = $(this);
        
        /* 切换 active 类：移除其他所有项的 active，给当前项加上 */
        $this.siblings().removeClass("active");
        $this.addClass("active");
        
        /* 调用 OnMainTags 加载左侧子菜单 */
        OnMainTags(this);
    });
    
    /* 点击第一个菜单项，触发加载 */
    var $firstItem = $("#panrent-menu .admin-nav-item").first();
    if ($firstItem.length) {
        $firstItem.addClass("active");
        OnMainTags($firstItem[0]);
    }

    /* 伸缩条点击事件绑定 */
    $("#resizerBar").on("click", OpenLeftMenu);
});

function OnMainTags(obj) {
    var sID = $(obj).data("mid");
    GetMenus(sID);
    $("#pageTitle").text($(obj).text().trim());
}

function GetMenus(MenuParentID) {
    $("#LeftMenuList").html('<div class="admin-loading"><img src="{{ admin_path }}images/loading.gif" alt="加载中" />加载菜单...</div>');
    var prams = {"pid": MenuParentID};
    post_form("/api/getsubmenus", prams, CompGetMenus);
}

function CompGetMenus(msg) {
    var aMenus = msg.data;
    if (aMenus == null || aMenus == undefined || aMenus.length < 1) {
        $("#LeftMenuList").html('<div style="padding:30px 16px;text-align:center;color:#9ca3af;font-size:13px;">您还没有安装任何模块</div>');
        return;
    }
    var html = '';
    for (var i = 0; i < aMenus.length; i++) {
        var m = aMenus[i];
        html += '<div class="sidebar-group">';
        html += '<div class="sidebar-group-title" onclick="OnMenuTitle(this)">';
        html += '<i class="' + m.img + '"></i> ' + m.MenuTitle;
        html += '<i class="fa fa-chevron-right arrow open"></i>';
        html += '</div>';
        html += '<ul class="sidebar-items" style="display:block;">';
        html += BindLeftMenuItems(m.Items);
        html += '</ul>';
        html += '</div>';
    }
    $("#LeftMenuList").html(html);

    $(".sidebar-item a").click(function() {
        $("#pageTitle").text($(this).text().trim());
        $(".sidebar-item").removeClass("active");
        $(this).parent().addClass("active");
    });
}

function BindLeftMenuItems(Items) {
    var html = '';
    for (var i = 0; i < Items.length; i++) {
        var item = Items[i];
        html += '<li class="sidebar-item" data-id="' + item.id + '" data-href="' + item.url + '" data-txt="' + item.ItemName + '">';
        html += '<a href="' + item.url + '" target="rform">';
        if (item.img) html += '<i class="' + item.img + '" style="margin-right:4px;"></i>';
        html += item.ItemName;
        html += '</a></li>';
    }
    return html;
}

function OnMenuTitle(ob) {
    var $title = $(ob);
    var $arrow = $title.find('.arrow');
    var $items = $title.next('.sidebar-items');
    if ($items.is(':visible')) {
        $items.slideUp(200);
        $arrow.removeClass('open');
    } else {
        $items.slideDown(200);
        $arrow.addClass('open');
    }
}

/* ===== 左侧菜单折叠/展开（修复版） ===== */
function OpenLeftMenu() {
    var $sidebar = $("#leftList");
    $sidebar.toggleClass("collapsed");
}
</script>

{% endblock %}
