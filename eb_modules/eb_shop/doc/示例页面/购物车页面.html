<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 · Green Rich</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #1a1f2e;
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
        }

        /* ============================================================
           顶部导航
           ============================================================ */
        .site-header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #1a1f2e;
            font-weight: 700;
            font-size: 17px;
            flex-shrink: 0;
        }

        .brand-logo .logo-icon {
            width: 36px;
            height: 36px;
            background: #e63946;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 16px;
        }

        .brand-logo .brand-sub {
            font-weight: 400;
            font-size: 12px;
            color: #8c95a5;
            margin-left: 2px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            list-style: none;
            flex: 1;
        }

        .nav-links a {
            text-decoration: none;
            color: #1a1f2e;
            font-size: 14px;
            font-weight: 500;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
            white-space: nowrap;
        }

        .nav-links a:hover {
            color: #e63946;
        }

        .nav-links a.active {
            color: #e63946;
            border-bottom-color: #e63946;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-shrink: 0;
        }

        .header-actions .icon-btn {
            color: #6b7280;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: color 0.15s;
            text-decoration: none;
        }

        .header-actions .icon-btn:hover {
            color: #e63946;
        }

        .header-actions .lang-text {
            font-size: 13px;
            color: #6b7280;
            cursor: pointer;
        }

        .btn-cart-header {
            background: #e63946;
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 7px 18px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: background 0.15s;
            text-decoration: none;
        }

        .btn-cart-header:hover {
            background: #d62839;
            color: #fff;
        }

        .btn-cart-header .cart-badge {
            background: #fff;
            color: #e63946;
            font-size: 10px;
            font-weight: 700;
            border-radius: 10px;
            padding: 1px 6px;
            min-width: 18px;
            text-align: center;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 22px;
            color: #1a1f2e;
            cursor: pointer;
            padding: 4px;
        }

        /* ============================================================
           面包屑
           ============================================================ */
        .breadcrumb {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 20px 0;
            font-size: 13px;
            color: #8c95a5;
        }

        .breadcrumb a {
            color: #8c95a5;
            text-decoration: none;
            transition: color 0.15s;
        }

        .breadcrumb a:hover {
            color: #e63946;
        }

        .breadcrumb span {
            margin: 0 6px;
        }

        /* ============================================================
           主容器
           ============================================================ */
        .cart-container {
            max-width: 1200px;
            margin: 20px auto 40px;
            padding: 0 20px;
        }

        .cart-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 28px 32px 36px;
        }

        .cart-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1f2e;
            margin-bottom: 6px;
        }

        .cart-subtitle {
            font-size: 13px;
            color: #8c95a5;
            margin-bottom: 24px;
        }

        /* 表头 */
        .cart-header-row {
            display: grid;
            grid-template-columns: 40px 1fr 140px 120px 140px 100px 60px;
            gap: 16px;
            align-items: center;
            padding: 12px 16px;
            background: #f8faff;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #5a6478;
            margin-bottom: 8px;
        }

        /* 商品行 */
        .cart-item {
            display: grid;
            grid-template-columns: 40px 1fr 140px 120px 140px 100px 60px;
            gap: 16px;
            align-items: center;
            padding: 18px 16px;
            border-bottom: 1px solid #eef1f6;
            transition: background 0.15s;
        }

        .cart-item:hover {
            background: #fafbfd;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-checkbox {
            width: 18px;
            height: 18px;
            accent-color: #e63946;
            cursor: pointer;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .item-image {
            width: 72px;
            height: 72px;
            border-radius: 10px;
            border: 1px solid #eef1f6;
            object-fit: cover;
            background: #f8faff;
            flex-shrink: 0;
        }

        .item-detail {
            min-width: 0;
            flex: 1;
        }

        .item-name {
            font-size: 14px;
            font-weight: 600;
            color: #1a1f2e;
            line-height: 1.4;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-sku {
            font-size: 12px;
            color: #8c95a5;
        }

        .item-price {
            font-size: 14px;
            color: #1a1f2e;
            font-weight: 500;
        }

        .item-price .original {
            font-size: 12px;
            color: #b8c0cc;
            text-decoration: line-through;
            display: block;
            margin-top: 2px;
        }

        .item-qty {
            display: inline-flex;
            align-items: center;
            border: 1.5px solid #d9dfe8;
            border-radius: 8px;
            overflow: hidden;
            width: fit-content;
        }

        .item-qty button {
            width: 32px;
            height: 32px;
            border: none;
            background: #ffffff;
            font-size: 15px;
            color: #3b4358;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-qty button:hover {
            background: #f8faff;
        }

        .item-qty button:disabled {
            color: #c0c9d9;
            cursor: not-allowed;
        }

        .item-qty input {
            width: 52px;
            height: 32px;
            border: none;
            border-left: 1.5px solid #d9dfe8;
            border-right: 1.5px solid #d9dfe8;
            text-align: center;
            font-size: 14px;
            color: #1a1f2e;
            outline: none;
            background: #ffffff;
            -moz-appearance: textfield;
        }

        .item-qty input::-webkit-outer-spin-button,
        .item-qty input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .item-subtotal {
            font-size: 15px;
            font-weight: 700;
            color: #e63946;
        }

        .item-hint {
            font-size: 12px;
            color: #d97706;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 6px;
            padding: 3px 8px;
            margin-top: 4px;
            display: inline-block;
            line-height: 1.4;
        }

        .item-price-source {
            font-size: 11px;
            color: #4c6fff;
            background: #eef2ff;
            padding: 1px 7px;
            border-radius: 10px;
            margin-left: 6px;
            display: inline-block;
            vertical-align: middle;
            font-weight: 500;
        }

        .item-remove {
            background: none;
            border: none;
            color: #b8c0cc;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.15s;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-remove:hover {
            color: #e63946;
        }

        /* 底部结算栏 */
        .cart-footer {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid #eef1f6;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .footer-left .select-all {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #3b4358;
            cursor: pointer;
            user-select: none;
        }

        .footer-left .select-all input {
            width: 18px;
            height: 18px;
            accent-color: #e63946;
            cursor: pointer;
        }

        .footer-left .btn-delete-selected {
            background: none;
            border: none;
            color: #8c95a5;
            font-size: 13px;
            cursor: pointer;
            transition: color 0.15s;
        }

        .footer-left .btn-delete-selected:hover {
            color: #e63946;
        }

        .footer-right {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .footer-summary {
            text-align: right;
        }

        .footer-summary .summary-line {
            font-size: 13px;
            color: #8c95a5;
            margin-bottom: 4px;
        }

        .footer-summary .summary-line .amount {
            color: #1a1f2e;
            font-weight: 500;
        }

        .footer-summary .total-line {
            font-size: 14px;
            color: #3b4358;
        }

        .footer-summary .total-line .total-price {
            font-size: 22px;
            font-weight: 800;
            color: #e63946;
            margin-left: 6px;
        }

        .btn-checkout {
            padding: 14px 40px;
            border: none;
            border-radius: 12px;
            background: #e63946;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(230, 57, 70, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-checkout:hover {
            background: #d62839;
            box-shadow: 0 6px 20px rgba(230, 57, 70, 0.4);
        }

        .btn-checkout:active {
            transform: scale(0.99);
        }

        .btn-checkout:disabled {
            background: #c0c9d9;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* 空购物车 */
        .cart-empty {
            text-align: center;
            padding: 80px 20px;
        }

        .cart-empty .empty-icon {
            font-size: 64px;
            color: #d9dfe8;
            margin-bottom: 20px;
        }

        .cart-empty .empty-text {
            font-size: 16px;
            color: #8c95a5;
            margin-bottom: 24px;
        }

        .cart-empty .btn-go-shopping {
            display: inline-block;
            padding: 12px 32px;
            border-radius: 10px;
            background: #e63946;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.15s;
        }

        .cart-empty .btn-go-shopping:hover {
            background: #d62839;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background-color: #1a1f2e;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            z-index: 1000;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            background-color: #0e9f6e;
        }

        .toast.warning {
            background-color: #d97706;
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            .cart-header-row {
                display: none;
            }

            .cart-item {
                grid-template-columns: 32px 1fr;
                grid-template-rows: auto auto auto auto;
                gap: 12px;
                padding: 18px 12px;
                position: relative;
            }

            .item-checkbox {
                grid-column: 1;
                grid-row: 1 / 5;
                align-self: center;
            }

            .item-info {
                grid-column: 2;
                grid-row: 1;
            }

            .item-price {
                grid-column: 2;
                grid-row: 2;
                font-size: 15px;
                font-weight: 700;
                color: #e63946;
            }

            .item-price .original {
                display: inline;
                margin-left: 8px;
                font-weight: 400;
            }

            .item-qty {
                grid-column: 2;
                grid-row: 3;
            }

            .item-subtotal {
                grid-column: 2;
                grid-row: 3;
                justify-self: end;
                align-self: center;
                font-size: 16px;
            }

            .item-remove {
                position: absolute;
                top: 16px;
                right: 12px;
            }

            .item-hint {
                grid-column: 2;
                grid-row: 4;
                margin-top: 0;
            }
        }

        @media (max-width: 860px) {
            .nav-links {
                display: none;
            }

            .mobile-menu-btn {
                display: block;
            }
        }

        @media (max-width: 720px) {
            .header-inner {
                height: 56px;
                padding: 0 16px;
                gap: 12px;
            }

            .brand-logo {
                font-size: 15px;
            }

            .brand-logo .logo-icon {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }

            .brand-logo .brand-sub {
                display: none;
            }

            .header-actions {
                gap: 12px;
            }

            .header-actions .lang-text,
            .header-actions .icon-btn.d-none-mobile {
                display: none;
            }

            .btn-cart-header {
                padding: 6px 12px;
                font-size: 12px;
            }

            .breadcrumb {
                padding: 16px 16px 0;
                font-size: 12px;
            }

            .cart-container {
                margin: 16px auto 28px;
                padding: 0 16px;
            }

            .cart-card {
                padding: 20px 16px 28px;
                border-radius: 12px;
            }

            .cart-title {
                font-size: 18px;
            }

            .item-image {
                width: 64px;
                height: 64px;
            }

            .item-name {
                font-size: 13px;
            }

            .cart-footer {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
            }

            .footer-left {
                justify-content: space-between;
            }

            .footer-right {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
            }

            .footer-summary {
                text-align: left;
            }

            .btn-checkout {
                width: 100%;
                justify-content: center;
                padding: 15px 24px;
            }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- 顶部导航 -->
    <header class="site-header">
        <div class="header-inner">
            <a href="#" class="brand-logo">
                <div class="logo-icon">G</div>
                <span>Green Rich<span class="brand-sub">金瑞治</span></span>
            </a>

            <ul class="nav-links">
                <li><a href="#">首页</a></li>
                <li><a href="#" class="active">产品中心</a></li>
                <li><a href="#">行业资讯</a></li>
                <li><a href="#">关于我们</a></li>
                <li><a href="#">加盟合作</a></li>
                <li><a href="#">AI下单</a></li>
            </ul>

            <div class="header-actions">
                <a href="#" class="icon-btn" title="搜索">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </a>
                <a href="#" class="icon-btn d-none-mobile" title="语言">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                </a>
                <span class="lang-text d-none-mobile">中文</span>
                <a href="#" class="icon-btn d-none-mobile" title="个人中心">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </a>
                <button class="btn-cart-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span>购物车</span>
                    <span class="cart-badge">{{ totalQuantity }}</span>
                </button>
                <button class="mobile-menu-btn" title="菜单">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- 面包屑 -->
    <div class="breadcrumb">
        <a href="#">首页</a>
        <span>/</span>
        <a href="#">购物车</a>
    </div>

    <!-- 购物车主区域 -->
    <main class="cart-container">
        <div class="cart-card">
            <!-- 空购物车 -->
            <div v-if="cartItems.length === 0" class="cart-empty">
                <div class="empty-icon">🛒</div>
                <div class="empty-text">购物车还是空的，去挑几件商品吧</div>
                <a href="#" class="btn-go-shopping">去逛逛</a>
            </div>

            <!-- 购物车内容 -->
            <template v-else>
                <h1 class="cart-title">我的购物车</h1>
                <p class="cart-subtitle">共 {{ cartItems.length }} 种商品，已选 {{ selectedCount }} 种</p>

                <!-- 表头 -->
                <div class="cart-header-row">
                    <div></div>
                    <div>商品信息</div>
                    <div>单价</div>
                    <div>数量</div>
                    <div>小计</div>
                    <div>优惠</div>
                    <div></div>
                </div>

                <!-- 商品行 -->
                <div
                    v-for="item in cartItems"
                    :key="item.id"
                    class="cart-item"
                >
                    <input
                        type="checkbox"
                        class="item-checkbox"
                        v-model="item.selected"
                    >

                    <div class="item-info">
                        <img class="item-image" :src="item.image" :alt="item.name">
                        <div class="item-detail">
                            <div class="item-name">{{ item.name }}</div>
                            <div class="item-sku">SKU: {{ item.sku }}</div>
                        </div>
                    </div>

                    <div class="item-price">
                        ¥{{ formatMoney(getItemPrice(item).price) }}
                        <span
                            v-if="getItemPrice(item).source !== '零售价'"
                            class="item-price-source"
                        >{{ getItemPrice(item).source }}</span>
                        <span
                            v-if="getItemPrice(item).price < item.marketPrice"
                            class="original"
                        >¥{{ formatMoney(item.marketPrice) }}</span>
                    </div>

                    <div class="item-qty">
                        <button
                            type="button"
                            @click="decreaseQty(item)"
                            :disabled="item.quantity <= 1"
                        >−</button>
                        <input
                            type="number"
                            v-model.number="item.quantity"
                            min="1"
                            :max="item.stock"
                            @change="validateQty(item)"
                        >
                        <button
                            type="button"
                            @click="increaseQty(item)"
                            :disabled="item.quantity >= item.stock"
                        >+</button>
                    </div>

                    <div class="item-subtotal">
                        ¥{{ formatMoney(getItemPrice(item).price * item.quantity) }}
                    </div>

                    <div>
                        <span
                            v-if="getItemHint(item)"
                            class="item-hint"
                        >{{ getItemHint(item) }}</span>
                    </div>

                    <button class="item-remove" @click="removeItem(item)" title="删除">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>

                <!-- 底部结算栏 -->
                <div class="cart-footer">
                    <div class="footer-left">
                        <label class="select-all">
                            <input
                                type="checkbox"
                                :checked="isAllSelected"
                                @change="toggleSelectAll"
                            >
                            全选
                        </label>
                        <button class="btn-delete-selected" @click="deleteSelected">删除选中</button>
                    </div>

                    <div class="footer-right">
                        <div class="footer-summary">
                            <div class="summary-line">
                                商品总价：<span class="amount">¥{{ formatMoney(goodsTotal) }}</span>
                            </div>
                            <div class="summary-line">
                                运费：<span class="amount">{{ shippingFee === 0 ? '包邮' : '¥' + formatMoney(shippingFee) }}</span>
                                <span
                                    v-if="shippingHint"
                                    style="color:#d97706;margin-left:6px;"
                                >{{ shippingHint }}</span>
                            </div>
                            <div class="total-line">
                                应付总额：<span class="total-price">¥{{ formatMoney(totalAmount) }}</span>
                            </div>
                        </div>

                        <button
                            class="btn-checkout"
                            :disabled="selectedCount === 0"
                            @click="checkout"
                        >
                            结算 ({{ selectedCount }})
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <!-- Toast -->
    <div class="toast" :class="[toastType, { show: toastVisible }]">{{ toastMessage }}</div>
</div>

<script>
    const { createApp, ref, computed } = Vue;

    createApp({
        setup() {
            // ============================================================
            // 当前登录用户
            // ============================================================
            const currentUser = {
                isLoggedIn: true,
                groupId: 'svip',
                groupName: 'svip'
            };

            // ============================================================
            // 运费配置
            // ============================================================
            const shippingConfig = {
                free_shipping_threshold: 500,
                flat_shipping_fee: 20
            };

            // ============================================================
            // 购物车数据
            // ============================================================
            const cartItems = ref([
                {
                    id: 'item_001',
                    productId: 'ccabbfdd0d3ae215bcdb9695ea57fe17',
                    sku: 'GX-IR1435-002',
                    name: 'Original / Green · Approx. 40,000 pages.',
                    image: 'https://picsum.photos/seed/product1/200/200',
                    quantity: 1,
                    stock: 1000,
                    marketPrice: 20,
                    costPrice: 14,
                    group_prices: [
                        { group_id: 'svip', group_name: 'svip', price: 16 },
                        { group_id: 'vip', group_name: 'vip', price: 18 }
                    ],
                    group_qty_prices: [
                        { min_qty: 10, max_qty: 49, price: 16 },
                        { min_qty: 50, max_qty: 99, price: 12 }
                    ],
                    selected: true
                },
                {
                    id: 'item_002',
                    productId: 'ccabbfdd0d3ae215bcdb9695ea57fe17',
                    sku: 'GX-IR1435-003',
                    name: 'Compatible / Black · Approx. 20,000 pages.',
                    image: 'https://picsum.photos/seed/product2/200/200',
                    quantity: 30,
                    stock: 500,
                    marketPrice: 18,
                    costPrice: 10,
                    group_prices: [
                        { group_id: 'svip', group_name: 'svip', price: 14 }
                    ],
                    group_qty_prices: [
                        { min_qty: 20, max_qty: 99, price: 13 },
                        { min_qty: 100, max_qty: null, price: 10 }
                    ],
                    selected: true
                },
                {
                    id: 'item_003',
                    productId: 'ccabbfdd0d3ae215bcdb9695ea57fe17',
                    sku: 'GX-IR1435-004',
                    name: 'Premium / Blue · Approx. 60,000 pages.',
                    image: 'https://picsum.photos/seed/product3/200/200',
                    quantity: 5,
                    stock: 800,
                    marketPrice: 25,
                    costPrice: 16,
                    group_prices: [
                        { group_id: 'svip', group_name: 'svip', price: 21 }
                    ],
                    group_qty_prices: [
                        { min_qty: 10, max_qty: 49, price: 20 },
                        { min_qty: 50, max_qty: null, price: 18 }
                    ],
                    selected: true
                }
            ]);

            // ============================================================
            // Toast
            // ============================================================
            const toastVisible = ref(false);
            const toastMessage = ref('');
            const toastType = ref('');
            let toastTimer = null;

            function showToast(message, type = '') {
                toastMessage.value = message;
                toastType.value = type;
                toastVisible.value = true;
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastVisible.value = false;
                }, 2600);
            }

            // ============================================================
            // 工具函数
            // ============================================================
            function formatMoney(value) {
                const num = Number(value);
                if (isNaN(num)) return '0.00';
                return num.toFixed(2);
            }

            // ============================================================
            // 价格计算
            // ============================================================
            function calculatePrice(sku, quantity, user) {
                const candidates = [];

                if (user.isLoggedIn && sku.group_prices) {
                    const memberPrice = sku.group_prices.find(gp => gp.group_id === user.groupId);
                    if (memberPrice) {
                        candidates.push({ price: memberPrice.price, source: '会员价' });
                    }
                }

                if (sku.group_qty_prices) {
                    for (let i = 0; i < sku.group_qty_prices.length; i++) {
                        const tier = sku.group_qty_prices[i];
                        const minOk = quantity >= tier.min_qty;
                        const maxOk = (tier.max_qty === null || tier.max_qty === undefined || tier.max_qty === '') || quantity <= tier.max_qty;
                        if (minOk && maxOk) {
                            candidates.push({
                                price: tier.price,
                                source: '阶梯价 ' + tier.min_qty + '-' + (tier.max_qty || '∞') + ' 件档'
                            });
                            break;
                        }
                    }
                }

                candidates.push({ price: sku.marketPrice, source: '零售价' });

                let best = candidates[0];
                for (let i = 1; i < candidates.length; i++) {
                    if (candidates[i].price < best.price) {
                        best = candidates[i];
                    }
                }

                let finalPrice = best.price;
                let finalSource = best.source;
                if (finalPrice < sku.costPrice) {
                    finalPrice = sku.costPrice;
                    finalSource = '成本价';
                }

                return { price: finalPrice, source: finalSource };
            }

            function getNextTierHint(sku, quantity, currentPrice) {
                if (!sku.group_qty_prices || sku.group_qty_prices.length === 0) {
                    return null;
                }

                for (let i = 0; i < sku.group_qty_prices.length; i++) {
                    const tier = sku.group_qty_prices[i];
                    if (quantity >= tier.min_qty) continue;
                    if (tier.price >= currentPrice) continue;
                    const diff = tier.min_qty - quantity;
                    return '再买 ' + diff + ' 件可享批发价 ' + formatMoney(tier.price) + ' 元';
                }

                return null;
            }

            // ============================================================
            // 计算属性
            // ============================================================
            const totalQuantity = computed(() => {
                return cartItems.value.reduce((sum, item) => sum + item.quantity, 0);
            });

            const selectedCount = computed(() => {
                return cartItems.value.filter(item => item.selected).length;
            });

            const isAllSelected = computed(() => {
                return cartItems.value.length > 0 && cartItems.value.every(item => item.selected);
            });

            const goodsTotal = computed(() => {
                let total = 0;
                cartItems.value.forEach(item => {
                    if (item.selected) {
                        const result = calculatePrice(item, item.quantity, currentUser);
                        total += result.price * item.quantity;
                    }
                });
                return total;
            });

            const shippingFee = computed(() => {
                if (goodsTotal.value <= 0) return 0;
                return goodsTotal.value >= shippingConfig.free_shipping_threshold
                    ? 0
                    : shippingConfig.flat_shipping_fee;
            });

            const shippingHint = computed(() => {
                if (goodsTotal.value <= 0) return '';
                if (goodsTotal.value >= shippingConfig.free_shipping_threshold) {
                    return '已满 ¥' + formatMoney(shippingConfig.free_shipping_threshold) + '，包邮';
                }
                const diff = shippingConfig.free_shipping_threshold - goodsTotal.value;
                return '再买 ¥' + formatMoney(diff) + ' 可包邮';
            });

            const totalAmount = computed(() => {
                return goodsTotal.value + shippingFee.value;
            });

            // ============================================================
            // 方法
            // ============================================================
            function getItemPrice(item) {
                return calculatePrice(item, item.quantity, currentUser);
            }

            function getItemHint(item) {
                const result = calculatePrice(item, item.quantity, currentUser);
                return getNextTierHint(item, item.quantity, result.price);
            }

            function decreaseQty(item) {
                if (item.quantity > 1) {
                    item.quantity--;
                }
            }

            function increaseQty(item) {
                if (item.quantity < item.stock) {
                    item.quantity++;
                }
            }

            function validateQty(item) {
                let val = parseInt(item.quantity, 10);
                if (isNaN(val) || val < 1) val = 1;
                if (val > item.stock) val = item.stock;
                item.quantity = val;
            }

            function removeItem(item) {
                cartItems.value = cartItems.value.filter(i => i.id !== item.id);
                showToast('已删除「' + item.name + '」', 'success');
            }

            function toggleSelectAll(event) {
                const checked = event.target.checked;
                cartItems.value.forEach(item => {
                    item.selected = checked;
                });
            }

            function deleteSelected() {
                const selected = cartItems.value.filter(item => item.selected);
                if (selected.length === 0) {
                    showToast('请先选择要删除的商品', 'warning');
                    return;
                }
                cartItems.value = cartItems.value.filter(item => !item.selected);
                showToast('已删除选中商品', 'success');
            }

            function checkout() {
                if (selectedCount.value === 0) {
                    showToast('请先选择要结算的商品', 'warning');
                    return;
                }

                const selectedItems = cartItems.value.filter(item => item.selected);
                console.log('提交结算:', {
                    items: selectedItems,
                    goodsTotal: goodsTotal.value,
                    shippingFee: shippingFee.value,
                    totalAmount: totalAmount.value
                });

                showToast('正在跳转结算页，应付 ¥' + formatMoney(totalAmount.value), 'success');
            }

            // ============================================================
            // 返回
            // ============================================================
            return {
                cartItems,
                currentUser,
                shippingConfig,
                totalQuantity,
                selectedCount,
                isAllSelected,
                goodsTotal,
                shippingFee,
                shippingHint,
                totalAmount,
                toastVisible,
                toastMessage,
                toastType,
                formatMoney,
                getItemPrice,
                getItemHint,
                decreaseQty,
                increaseQty,
                validateQty,
                removeItem,
                toggleSelectAll,
                deleteSelected,
                checkout
            };
        }
    }).mount('#app');
</script>

</body>
</html>
