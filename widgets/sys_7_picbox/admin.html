{% from "jinja2_ctrs/_upload_macros.html" import upload_assets, img_upload_multi %}

{{ img_upload_multi('info', model.info, '可以上传多图，支持粘贴', 80, 80) }}

<div class="mb-3">
    <label>数据绑定模板（Flask 模板语法）</label>
